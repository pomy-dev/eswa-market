<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Eswa-Market — Digital Marketing Agency</title>
  <meta name="description"
    content="Africa's leading digital marketing agency. SEO, social media, PPC, content and email marketing packages." />
  <!-- PWA Configuration -->
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="DigitalEdge" />
  <link rel="apple-touch-icon" href="/icon/icon-512.png" />
  <meta name="author" content="Eswa" />
  <link rel="icon" type="image" href="/icon/logo.png" />

  <meta property="og:title" content="Eswa-Market App" />
  <meta property="og:description" content="An app made by https://hercules.app" />
  <meta property="og:type" content="website" />

  <meta property="og:image:type" content="image/png" />

  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:site" content="@usehercules" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" crossorigin />

  <!-- Detect dark mode preference and set the class before next-themes loads. This avoids a flash of unstyled content (FOUC) when the page loads. -->
  <script>
    try {
      let theme = localStorage.getItem("theme");
      if (theme === "system" || !theme) {
        let prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        theme = prefersDark ? "dark" : "light";
      }
      document.documentElement.classList.add(theme);
    } catch (e) { }
  </script>

  <link href="/src/index.css" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
